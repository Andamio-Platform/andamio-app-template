name: API types check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - run: npm ci

      - run: npm run generate:types

      - run: npm run check

      - run: git diff --exit-code -- src/types/generated/gateway.ts src/types/generated/api-metadata.json

      - run: npm run check:transaction-endpoints
