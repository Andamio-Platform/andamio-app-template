name: API types check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run generate:types

      - run: npm run check

      - run: git diff --exit-code -- src/types/generated/gateway.ts src/types/generated/api-metadata.json

      - run: npm run check:transaction-endpoints
